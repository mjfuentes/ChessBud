<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChessBud</title>
  <link rel="icon" type="image/png" href="img/icon.png">
  <link rel="apple-touch-icon" href="img/icon.png">
  <link rel="stylesheet" href="vendor/chessground.base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="appbar">
    <img class="brand" id="brand-link" src="img/wordmark.png" alt="ChessBud">
    <button id="nav-home">Home</button>
    <button id="nav-practice">Opening practice</button>
    <button id="nav-blunders">Blunder replay</button>
  </nav>
  <main id="home" class="home" hidden>
    <div class="home-col home-side">
      <div class="side-head">As White</div>
      <ol class="openings" id="home-white"></ol>
    </div>

    <div class="home-canopy">
      <div class="canopy-figure" id="tree"></div>
      <figcaption class="canopy-caption" id="tree-caption">
        <span class="cap-name" id="cap-name">Your repertoire</span>
        <span class="cap-detail" id="cap-detail">
          Branch length is how deep you have taken an opening; foliage is the
          lines you have cleared. Hover a branch.
        </span>
      </figcaption>
      <div class="canopy-modes">
        <button class="mode-link" id="home-practice">
          <span class="mode-title">Opening practice</span>
          <span class="mode-desc" id="practice-desc">Loading…</span>
        </button>
        <button class="mode-link" id="home-replay">
          <span class="mode-title">Blunder replay</span>
          <span class="mode-desc" id="replay-desc">Loading…</span>
        </button>
        <div class="profile-stats" id="profile-stats"></div>
      </div>
    </div>

    <div class="home-col home-side">
      <div class="side-head">As Black</div>
      <ol class="openings" id="home-black"></ol>
    </div>
  </main>

  <main class="game-view" id="game" hidden>
    <div class="layout">
    <section class="board-wrap">
      <div id="evalbar" class="evalbar"><div id="evalfill" class="evalfill"></div></div>
      <div class="board-col">
        <div id="captured-top" class="captured"></div>
        <div id="board" class="board"></div>
        <div id="captured-bottom" class="captured"></div>
      </div>
    </section>
    <aside class="panel">
      <h1 id="drill-name">Opening Practice</h1>
      <div id="opening-name" class="opening-name"></div>
      <div id="status" class="status"></div>
      <div id="context" class="context" hidden></div>
      <div id="message" class="message note"></div>
      <div class="panel-buttons">
        <div id="puzzle-actions" class="puzzle-actions" hidden>
          <button id="retry">Retry</button>
          <button id="next">Next puzzle</button>
        </div>
        <div class="panel-actions">
          <button id="hint" class="hint-btn">Hint</button>
        </div>
      </div>
      <h2>Moves</h2>
      <ol id="moves" class="moves"></ol>
      <div class="hints">
        <b>H</b> home · <b>N</b> new practice game · <b>B</b> blunder replay ·
        <b>←→</b> review · <b>I</b> hint · <b>U</b> undo · <b>F</b> flip · <b>M</b> sound ·
        click a move to jump · right-click to draw
      </div>
    </aside>
    </div>
  </main>
  <div id="verdict-modal" class="modal" hidden>
    <div class="modal-card">
      <div id="verdict-title" class="verdict-title"></div>
      <div id="verdict-reason" class="verdict-reason"></div>
      <div id="verdict-drift" class="verdict-drift"></div>
      <div id="verdict-stats" class="verdict-stats"></div>
      <div id="verdict-family" class="verdict-family"></div>
      <div class="modal-actions">
        <button id="v-repeat">Repeat</button>
        <button id="v-next">Next</button>
        <button id="v-playon">Play on</button>
      </div>
    </div>
  </div>
  <script src="sound.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
